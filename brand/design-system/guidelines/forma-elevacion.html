<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px 28px;min-height:190px;box-sizing:border-box}.k{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;color:var(--color-texto-2)}.v{font-family:var(--font-mono);font-size:12px;color:var(--color-texto-3)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--color-linea)}</style></head><body><div class="row" style="gap:18px;padding-top:6px"><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--color-noche-1);border:1px solid var(--color-linea)"></div><span class="k">e0 · plano</span><span class="v">fondo</span></div><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--color-noche-2);border:1px solid var(--color-linea)"></div><span class="k">e1 · superficie</span><span class="v">bloques, pasos</span></div><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--color-noche-3);border:1px solid var(--color-linea);box-shadow:var(--shadow-tooltip)"></div><span class="k">e2 · tooltip</span><span class="v">--shadow-tooltip</span></div><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--color-noche-3);border:1px solid var(--color-linea);box-shadow:var(--shadow-flotante)"></div><span class="k">e3 · flotante</span><span class="v">toast, hoja</span></div><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--color-noche-1);border:1px solid var(--color-luz);box-shadow:var(--shadow-halo)"></div><span class="k">halo</span><span class="v">solo lo encendido</span></div></div></body></html>
