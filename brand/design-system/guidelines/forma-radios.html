<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px 28px;min-height:150px;box-sizing:border-box}.k{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;color:var(--color-texto-2)}.v{font-family:var(--font-mono);font-size:12px;color:var(--color-texto-3)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--color-linea)}</style></head><body><div class="row" style="gap:20px"><div class="sw"><div style="height:64px;background:var(--color-noche-3);border:1px solid var(--color-linea);border-radius:var(--radius-xs)"></div><span class="k">radius-xs · 2px</span><span class="v">etiquetas, foco</span></div><div class="sw"><div style="height:64px;background:var(--color-noche-3);border:1px solid var(--color-linea);border-radius:var(--radius-sm)"></div><span class="k">radius-sm · 4px</span><span class="v">campos, chips</span></div><div class="sw"><div style="height:64px;background:var(--color-noche-3);border:1px solid var(--color-linea);border-radius:var(--radius-md)"></div><span class="k">radius-md · 8px</span><span class="v">botones, toast</span></div><div class="sw"><div style="height:64px;background:var(--color-noche-3);border:1px solid var(--color-linea);border-radius:var(--radius-lg)"></div><span class="k">radius-lg · 14px</span><span class="v">tarjetas, hojas</span></div><div class="sw"><div style="height:64px;background:var(--color-noche-3);border:1px solid var(--color-linea);border-radius:var(--radius-full)"></div><span class="k">radius-full · 9999px</span><span class="v">puntos, pills</span></div></div></body></html>
