<!doctype html>
<html lang="es">
<head>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<div id="root"></div>

<script type="text/babel" src="CarruselTarjetas.jsx"></script>
<script type="text/babel">
const trazo = { 18: 61, 19: 60, 20: 59.5, 21: 59, 22: 58.6, 23: 58.2, 24: 58, 25: 57.8, 26: 58, 27: 58.4, 28: 58.8, 29: 59 };
const P = ({ n, children }) => <div><div className="lbl">{n}</div><div className="f">{children}</div></div>;
function Pantallas() {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 390px)", gap: "40px 32px" }}>
      <P n="01 · Hero"><Hero alto="844px" /></P>
      <P n="02 · Campo de puntos de escala"><EscenaEscala alto="844px" pasoFijo={1} /></P>

      <P n="03b · Dibújalo tú · revelado"><DibujaloTu trazoInicial={trazo} reveladoInicial /></P>
      <P n="04 · Paso de cohorte"><EscenaCohorte alto="844px" pasoFijo={1} /></P>
      <P n="05 · Mapa"><EscenaMapa /></P>
      <P n="07 · Formulario del Wrapped"><FormularioWrapped inicial={{ estado: "JAL", municipio: "Zapopan", edad: 24, sexo: "mujer" }} /></P>
      <P n="08 · Carrusel de tarjetas"><CarruselTarjetas datos={{ municipio: "Zapopan", edad: 24 }} /></P>

ReactDOM.createRoot(document.getElementById("root")).render(<Pantallas />);
