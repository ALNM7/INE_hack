<body>
<div id="root" data-composition-id="hero" data-start="0" data-width="1920" data-height="1080" data-duration="8" data-fps="30">
<canvas id="campo" class="clip" data-start="0" data-duration="8" data-track-index="0" width="1920" height="1080"></canvas>
</div>
<script>
(() => {
  const raiz = document.getElementById("root");
  const ANCHO = Number(raiz.dataset.width);
  const ALTO = Number(raiz.dataset.height);
  const DURACION = Number(raiz.dataset.duration);
  const FPS = Number(raiz.dataset.fps);
  const C = BRAND.color;
  const D = BRAND.duracion;
  const lineal = BRAND.curva.scroll === "linear" ? "none" : BRAND.curva.scroll;
  const easeApagado = gsap.parseEase("apagado");
  const easeEntrada = gsap.parseEase("entrada");

  const COLUMNAS = 48;
  const FILAS = 27;
  const INICIO_OLA = 1;
  const CRUCE = 2.8;
  const PAUSA = D.escena;

  function semilla(a) {
    return () => {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const azar = semilla(2024);

  function hexRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const rgbLuz = hexRgb(C.luz);
  const rgbApagada = hexRgb(C.apagada);
  const rgbSuave = hexRgb(C.luzSuave);

  const pasoX = ANCHO / COLUMNAS;
  const pasoY = ALTO / FILAS;
  const luces = [];
  for (let f = 0; f < FILAS; f++) {
    for (let c = 0; c < COLUMNAS; c++) {
      const x = (c + 0.5) * pasoX + (azar() - 0.5) * pasoX * 0.7;
      const y = (f + 0.5) * pasoY + (azar() - 0.5) * pasoY * 0.7;
      const frente = 0.1 * Math.sin((y / ALTO) * Math.PI * 2 + 0.6) + (azar() - 0.5) * 0.24;
      luces.push({
        x,
        y,
        r: 1.6 + azar() * 1.6,
        brillo: 0.55 + azar() * 0.45,
        ciclos: azar() < 0.5 ? 1 : 2,
        fase: azar() * Math.PI * 2,
        apaga: INICIO_OLA + (x / ANCHO) * CRUCE + frente,
      });
    }
  }

  const RADIO_HALO = Math.round(pasoX * 0.42);
  const sprite = document.createElement("canvas");
  sprite.width = sprite.height = RADIO_HALO * 2;
  const sctx = sprite.getContext("2d");
  const grad = sctx.createRadialGradient(RADIO_HALO, RADIO_HALO, 0, RADIO_HALO, RADIO_HALO, RADIO_HALO);
  grad.addColorStop(0, C.luzHalo);
  grad.addColorStop(1, "transparent");
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, RADIO_HALO * 2, RADIO_HALO * 2);

  const lienzo = document.getElementById("campo");
  const ctx = lienzo.getContext("2d");

  function encendido(luz, t) {
    const a = luz.apaga;
    if (t <= a) return 1;
    if (t < a + D.escena) return 1 - easeApagado((t - a) / D.escena);
    const b = a + D.escena + PAUSA;
    if (t <= b) return 0;
    if (t < b + D.encendido) return easeEntrada((t - b) / D.encendido);
    return 1;
  }

  function mezcla(a, b, k) {
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * k)} ${Math.round(a[1] + (b[1] - a[1]) * k)} ${Math.round(a[2] + (b[2] - a[2]) * k)})`;
  }

  const estado = { p: 0 };
  function dibujar() {
    const p = estado.p;
    const t = p * DURACION;
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.fondo;
    ctx.fillRect(0, 0, ANCHO, ALTO);
    const brillos = new Float32Array(luces.length);
    const niveles = new Float32Array(luces.length);
    for (let i = 0; i < luces.length; i++) {
      const luz = luces[i];
      const respira = 0.5 + 0.5 * Math.sin(Math.PI * 2 * luz.ciclos * p + luz.fase);
      niveles[i] = encendido(luz, t);
      brillos[i] = luz.brillo * (0.62 + 0.38 * respira);
    }
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < luces.length; i++) {
      const k = niveles[i] * brillos[i];
      if (k <= 0.002) continue;
      ctx.globalAlpha = Math.min(1, k);
      ctx.drawImage(sprite, luces[i].x - RADIO_HALO, luces[i].y - RADIO_HALO);
    }
    ctx.globalCompositeOperation = "source-over";
    for (let i = 0; i < luces.length; i++) {
      const luz = luces[i];
      const k = niveles[i];
      const caliente = brillos[i] > 0.8 ? (brillos[i] - 0.8) / 0.2 : 0;
      const encendida = caliente > 0 ? mezcla(rgbLuz, rgbSuave, caliente * 0.6) : C.luz;
      ctx.globalAlpha = 0.5 + 0.5 * (k * brillos[i] + (1 - k) * 0.7);
      ctx.fillStyle = k >= 1 ? encendida : mezcla(rgbApagada, rgbLuz, k);
      ctx.beginPath();
      ctx.arc(luz.x, luz.y, luz.r * (0.8 + 0.2 * k), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  dibujar();
  const tl = gsap.timeline({ paused: true });
  const FIN = DURACION - 1 / FPS;
  const cortes = [0, INICIO_OLA, INICIO_OLA + CRUCE * 0.6, INICIO_OLA + CRUCE * 1.2, INICIO_OLA + CRUCE * 1.8, FIN];
  for (let i = 1; i < cortes.length; i++) {
    tl.to(estado, { p: cortes[i] / FIN, duration: cortes[i] - cortes[i - 1], ease: lineal, onUpdate: dibujar }, cortes[i - 1]);
  }
  window.__timelines["hero"] = tl;
})();
</script>
