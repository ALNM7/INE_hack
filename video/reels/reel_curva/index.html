<script type="application/json" id="d-config" data-fuente="config.json">{"url":"alnm7.github.io/INE_hack","zona_segura":{"arriba":250,"abajo":350,"lados":90},"subtitulos":{"max_caracteres":42,"corte":34}}</script>
<script src="assets/comun/reel.js"></script>
<script>
(() => {
  const { leer, decimal, D } = Reel;
  const C = BRAND.color;
  const edad = leer("d-edad");
  const grupos = leer("d-estados").grupos;
  const ANIO = "2024";
  const tope = parseInt(grupos.at(-1), 10);
  const puntos = edad.edades.map((e, i) => ({ e, v: edad[ANIO][i] })).filter((p) => p.e < tope && p.v !== null);
  const minimo = puntos.reduce((a, b) => (b.v < a.v ? b : a));
  const redondo = Math.round(minimo.v);

  const ANCHO = 900;
  const ALTO = 900;
  const M = { arriba: 110, derecha: 24, abajo: 90, izquierda: 92 };
  const x = d3.scaleLinear().domain(d3.extent(puntos, (p) => p.e)).range([M.izquierda, ANCHO - M.derecha]);
  const y = d3.scaleLinear().domain(d3.extent(puntos, (p) => p.v)).nice().range([ALTO - M.abajo, M.arriba]);

  const svg = d3.select("#grafica").append("svg").attr("viewBox", `0 0 ${ANCHO} ${ALTO}`).attr("width", ANCHO).attr("height", ALTO);
  svg.append("text").attr("id", "titulo-grafica").attr("x", M.izquierda).attr("y", 40).attr("fill", C.texto2).attr("font-size", 30).attr("letter-spacing", "0.1em").text(`PARTICIPACIÓN POR EDAD, ${ANIO}`);

  const yTicks = y.ticks(4);
  const rejilla = svg.append("g").attr("id", "rejilla");
  yTicks.forEach((t, i) => {
    rejilla.append("rect").attr("class", "guia").attr("id", `guia-${i}`).attr("x", M.izquierda).attr("width", ANCHO - M.derecha - M.izquierda).attr("y", y(t) - 1).attr("height", 2).attr("fill", C.linea);
    rejilla.append("text").attr("class", "eje-y").attr("x", M.izquierda - 18).attr("y", y(t) + 9).attr("text-anchor", "end").attr("fill", C.texto3).attr("font-size", 26).text(`${t}%`);
  });
  const xTicks = [x.domain()[0], ...x.ticks(6).filter((t) => t > x.domain()[0] + 4 && t < x.domain()[1] - 4 && Math.abs(t - minimo.e) > 6), x.domain()[1]];
  xTicks.forEach((t) => {
    svg.append("text").attr("class", "eje-x").attr("x", x(t)).attr("y", ALTO - M.abajo + 46).attr("text-anchor", "middle").attr("fill", C.texto3).attr("font-size", 26).text(t);
  });
  svg.append("text").attr("class", "eje-x").attr("x", ANCHO - M.derecha).attr("y", ALTO - M.abajo + 84).attr("text-anchor", "end").attr("fill", C.texto3).attr("font-size", 24).text("EDAD");

  const area = d3.area().x((p) => x(p.e)).y0(y.range()[0]).y1((p) => y(p.v)).curve(d3.curveMonotoneX);
  const linea = d3.line().x((p) => x(p.e)).y((p) => y(p.v)).curve(d3.curveMonotoneX);
  const relleno = svg.append("path").attr("id", "area").attr("d", area(puntos)).attr("fill", C.luzHalo).attr("opacity", 0);
  const trazo = svg.append("path").attr("id", "curva").attr("d", linea(puntos)).attr("fill", "none").attr("stroke", C.luz).attr("stroke-width", 7).attr("stroke-linecap", "round").attr("stroke-linejoin", "round");
  const largo = trazo.node().getTotalLength();
  trazo.attr("stroke-dasharray", `${largo} ${largo}`).attr("stroke-dashoffset", largo);

  const mx = x(minimo.e);
  const my = y(minimo.v);
  const marcador = svg.append("g").attr("id", "marcador").attr("opacity", 0);
  const halo = marcador.append("circle").attr("id", "halo-minimo").attr("cx", mx).attr("cy", my).attr("r", 34).attr("fill", C.luzHalo);
  marcador.append("circle").attr("id", "punto-minimo").attr("cx", mx).attr("cy", my).attr("r", 15).attr("fill", C.luz).attr("stroke", C.fondo).attr("stroke-width", 5);
  const etiquetaMin = svg.append("text").attr("id", "etiqueta-minimo").attr("x", mx).attr("y", ALTO - M.abajo + 46).attr("text-anchor", "middle").attr("fill", C.luz).attr("font-size", 28).attr("font-weight", 600).attr("opacity", 0).text(`${minimo.e} AÑOS`);

  document.getElementById("respuesta-cifra").textContent = `${redondo}%`;
  document.getElementById("respuesta-etiqueta").textContent = `votó a los ${minimo.e} años en ${ANIO}`;

  const tl = gsap.timeline({ paused: true });
  Reel.cabecera(tl);
  Reel.subtitulos(tl, [
    { texto: "¿A qué edad crees que menos se vota?", desde: 0.4, hasta: 3.9 },
    { texto: `A los *${minimo.e}*. Solo *${redondo}%*.`, desde: 8.2, hasta: 12.3 },
  ]);

  tl.fromTo("#titulo-grafica", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 0.6);
  tl.fromTo(".guia", { opacity: 0, scaleX: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: D.escena, ease: "entrada", stagger: 0.07 }, 0.8);
  tl.fromTo(".eje-y, .eje-x", { opacity: 0 }, { opacity: 1, duration: D.larga, ease: "entrada", stagger: 0.03 }, 1.1);
  tl.to(trazo.node(), { attr: { "stroke-dashoffset": 0 }, duration: 2, ease: "escena" }, 2.6);
  tl.to(relleno.node(), { opacity: 0.45, duration: D.escena, ease: "entrada" }, 4.6);
  tl.fromTo(marcador.node(), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: D.larga, ease: "enfasis" }, 5.5);
  tl.fromTo(etiquetaMin.node(), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 5.95);
  tl.fromTo("#grafica", { y: 0, scale: 1 }, { y: 60, scale: 0.6, duration: D.escena * 1.4, ease: "escena" }, 6.4);
  tl.fromTo("#respuesta-cifra", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: D.escena, ease: "entrada" }, 7.7);
  tl.fromTo("#respuesta-etiqueta", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 8.0);
  for (let i = 0; i < 4; i++) {
    tl.to(halo.node(), { scale: i % 2 ? 1 : 1.35, opacity: i % 2 ? 1 : 0.5, transformOrigin: "50% 50%", duration: D.escena, ease: "escena" }, 8.4 + i * D.escena);
  }
  tl.to("#visual", { opacity: 0, y: -24, duration: D.larga, ease: "salida" }, 12.3);
  Reel.cierre(tl, 12.7);
  window.__timelines["reel_curva"] = tl;
})();
