<script type="application/json" id="d-config" data-fuente="config.json">{"url":"alnm7.github.io/INE_hack","zona_segura":{"arriba":250,"abajo":350,"lados":90},"subtitulos":{"max_caracteres":42,"corte":34}}</script>
<script src="assets/comun/reel.js"></script>
<script>
(() => {
  const { leer, decimal, D, meta } = Reel;
  const C = BRAND.color;
  const F = BRAND.fuente;
  const larga = leer("d-cohortes").larga;
  const fila = larga.filas.reduce((a, b) => (b[0] < a[0] ? b : a));
  const anios = larga.campos.slice(1).map((c) => Number(c.replace(/\D/g, "")));
  const columnas = anios.map((anio, i) => ({ anio, edad: fila[0] + (anio - anios[0]), valor: fila[i + 1] }));
  const caida = columnas[0].valor - columnas.at(-1).valor;

  const ANCHO = 900;
  const ALTO = 840;
  const BASE = 660;
  const ALTURA_MAX = 500;
  const y = d3.scaleLinear().domain([0, 100]).range([0, ALTURA_MAX]);
  const x = d3.scalePoint().domain(columnas.map((c) => c.anio)).range([150, ANCHO - 150]);
  const escala = d3.scaleQuantize().domain([0, 100]).range(d3.range(9).map((i) => C[`seq${i}`]));
  const BARRA = 190;

  const svg = d3.select("#grafica").append("svg").attr("viewBox", `0 0 ${ANCHO} ${ALTO}`).attr("width", ANCHO).attr("height", ALTO);
  svg.append("text").attr("id", "titulo-grafica").attr("x", 0).attr("y", 40).attr("fill", C.texto2).attr("font-size", 30).attr("letter-spacing", "0.1em").text(`QUIENES TENÍAN ${fila[0]} EN ${anios[0]}`);
  svg.append("rect").attr("id", "base").attr("x", 0).attr("y", BASE).attr("width", ANCHO).attr("height", 2).attr("fill", C.linea);

  columnas.forEach((c, i) => {
    const cx = x(c.anio);
    const alto = y(c.valor);
    svg.append("rect").attr("class", "barra").attr("id", `barra-${i}`).attr("x", cx - BARRA / 2).attr("y", BASE - alto).attr("width", BARRA).attr("height", alto).attr("rx", 6).attr("fill", i === 0 ? C.luz : escala(c.valor));
    svg.append("text").attr("class", "valor").attr("id", `valor-${i}`).attr("x", cx).attr("y", BASE - alto - 28).attr("text-anchor", "middle").attr("fill", i === 0 ? C.luz : C.texto).style("font-family", F.titulo).attr("font-weight", F.peso.extra).style("font-stretch", F.estiramientoTitulo).attr("font-size", 92).attr("letter-spacing", "-0.03em").text(`${decimal(c.valor)}%`);
    svg.append("text").attr("class", "anio").attr("id", `anio-${i}`).attr("x", cx).attr("y", BASE + 56).attr("text-anchor", "middle").attr("fill", C.texto2).attr("font-size", 34).attr("font-weight", 600).text(c.anio);
    svg.append("text").attr("class", "edad").attr("id", `edad-${i}`).attr("x", cx).attr("y", BASE + 100).attr("text-anchor", "middle").attr("fill", C.texto3).attr("font-size", 28).text(`${c.edad} años`);
  });

  const puntos = columnas.map((c) => [x(c.anio), BASE - y(c.valor)]);
  const pendiente = svg.append("path").attr("id", "pendiente").attr("d", d3.line()(puntos)).attr("fill", "none").attr("stroke", C.alerta).attr("stroke-width", 5).attr("stroke-linecap", "round");
  const largo = pendiente.node().getTotalLength();
  pendiente.attr("stroke-dasharray", `${largo} ${largo}`).attr("stroke-dashoffset", largo);
  const nodos = svg.append("g").attr("id", "nodos").attr("opacity", 0);
  puntos.forEach(([px, py]) => nodos.append("circle").attr("cx", px).attr("cy", py).attr("r", 10).attr("fill", C.alerta));
  const fin = puntos.at(-1);
  const caidaG = svg.append("g").attr("id", "caida").attr("opacity", 0);
  caidaG.append("text").attr("x", fin[0]).attr("y", fin[1] + 92).attr("text-anchor", "middle").attr("fill", C.fondo).style("font-family", F.titulo).attr("font-weight", F.peso.extra).style("font-stretch", F.estiramientoTitulo).attr("font-size", 64).text(`−${decimal(caida)}`);
  caidaG.append("text").attr("x", fin[0]).attr("y", fin[1] + 132).attr("text-anchor", "middle").attr("fill", C.fondo).attr("font-size", 28).attr("font-weight", 600).text("PUNTOS");

  document.getElementById("nota-cohorte").textContent = meta.cohorte;

  const tl = gsap.timeline({ paused: true });
  Reel.cabecera(tl);
  Reel.subtitulos(tl, [
    { texto: `En ${anios[0]} tenías *${fila[0]}* y votaste.`, desde: 0.4, hasta: 3.7 },
    { texto: "¿Y después?", desde: 3.9, hasta: 6.1 },
    { texto: `A los ${columnas[1].edad}, *${decimal(columnas[1].valor)}%*. A los ${columnas[2].edad}, *${decimal(columnas[2].valor)}%*.`, desde: 6.3, hasta: 12.3 },
  ]);

  tl.fromTo("#titulo-grafica", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 0.5);
  tl.fromTo("#base", { opacity: 0, scaleX: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: D.escena, ease: "entrada" }, 0.6);
  const entradas = [1.0, 4.3, 5.4];
  columnas.forEach((c, i) => {
    const t = entradas[i];
    tl.fromTo(`#anio-${i}, #edad-${i}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada", stagger: 0.06 }, t);
    tl.fromTo(`#barra-${i}`, { scaleY: 0.02, opacity: 0, transformOrigin: "50% 100%" }, { scaleY: 1, opacity: 1, duration: D.encendido * 0.7, ease: "entrada" }, t + 0.1);
    tl.fromTo(`#valor-${i}`, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, t + 0.1 + D.encendido * 0.7);
  });
  tl.to(pendiente.node(), { attr: { "stroke-dashoffset": 0 }, duration: D.encendido, ease: "escena" }, 7.6);
  tl.to(nodos.node(), { opacity: 1, duration: D.larga, ease: "entrada" }, 9.0);
  tl.fromTo("#caida", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 9.6);
  tl.fromTo("#nota-cohorte", { opacity: 0 }, { opacity: 1, duration: D.escena, ease: "entrada" }, 10.2);
  tl.to("#barra-1, #barra-2", { opacity: 0.8, duration: D.escena, ease: "escena" }, 11.2);
  tl.to("#visual", { opacity: 0, y: -24, duration: D.larga, ease: "salida" }, 12.3);
  Reel.cierre(tl, 12.7);
  window.__timelines["reel_cohorte"] = tl;
})();
</script>
