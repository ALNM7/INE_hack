<script type="application/json" id="d-config" data-fuente="config.json">{"url":"alnm7.github.io/INE_hack","zona_segura":{"arriba":250,"abajo":350,"lados":90},"subtitulos":{"max_caracteres":42,"corte":34}}</script>
<script src="assets/comun/reel.js"></script>
<script>
(() => {
  const { leer, decimal, D } = Reel;
  const C = BRAND.color;
  const F = BRAND.fuente;
  const CAMPO = "jovenes_18_24";
  const ANIO = "2024";
  const [edadMin, edadMax] = CAMPO.split("_").slice(1).map(Number);
  const estados = leer("d-estados").estados.filter((e) => e[CAMPO][ANIO] !== null);
  const valor = new Map(estados.map((e) => [e.c, e[CAMPO][ANIO]]));
  const orden = [...estados].sort((a, b) => a[CAMPO][ANIO] - b[CAMPO][ANIO]);
  const bajo = orden[0];
  const alto = orden.at(-1);
  const geo = leer("d-geo");
  const capa = topojson.feature(geo, geo.objects[Object.keys(geo.objects)[0]]);

  const ANCHO = 900;
  const MAPA_ALTO = 640;
  const proyeccion = d3.geoMercator().fitExtent([[0, 80], [ANCHO, 80 + MAPA_ALTO]], capa);
  const ruta = d3.geoPath(proyeccion);
  const extremos = d3.extent(estados, (e) => e[CAMPO][ANIO]);
  const escala = d3.scaleQuantize().domain(extremos).range(d3.range(1, 9).map((i) => C[`seq${i}`]));

  const svg = d3.select("#grafica").append("svg").attr("viewBox", `0 0 ${ANCHO} 900`).attr("width", ANCHO).attr("height", 900);
  svg.append("text").attr("id", "titulo-grafica").attr("x", 0).attr("y", 40).attr("fill", C.texto2).attr("font-size", 30).attr("letter-spacing", "0.1em").text(`JÓVENES DE ${edadMin} A ${edadMax} QUE VOTARON, ${ANIO}`);
  const mapa = svg.append("g").attr("id", "mapa");
  const paths = new Map();
  for (const f of capa.features) {
    const c = f.properties.c;
    const p = mapa.append("path").attr("class", "estado").attr("d", ruta(f)).attr("fill", C.superficieAlta).attr("stroke", C.fondo).attr("stroke-width", 1.5).attr("stroke-linejoin", "round");
    paths.set(c, { nodo: p.node(), centro: ruta.centroid(f) });
  }

  function llamada(id, estado, tx, ty, ancla) {
    const [cx, cy] = paths.get(estado.c).centro;
    const dx = tx - cx;
    const dy = ty - cy;
    const g = svg.append("g").attr("id", id).attr("opacity", 0);
    g.append("line").attr("x1", cx).attr("y1", cy).attr("x2", cx + dx).attr("y2", cy + dy).attr("stroke", C.texto).attr("stroke-width", 2);
    g.append("circle").attr("class", "foco-llamada").attr("cx", cx).attr("cy", cy).attr("r", 9).attr("fill", C.texto).attr("stroke", C.fondo).attr("stroke-width", 3);
    g.append("text").attr("x", cx + dx).attr("y", cy + dy + (dy < 0 ? -48 : 34)).attr("text-anchor", ancla).attr("fill", C.texto2).attr("font-size", 28).attr("font-weight", 600).attr("letter-spacing", "0.08em").text(estado.n.toUpperCase());
    g.append("text").attr("x", cx + dx).attr("y", cy + dy + (dy < 0 ? -2 : 92)).attr("text-anchor", ancla).attr("fill", C.texto).style("font-family", F.titulo).attr("font-weight", F.peso.extra).style("font-stretch", F.estiramientoTitulo).attr("font-size", 64).text(`${decimal(estado[CAMPO][ANIO])}%`);
    return g;
  }
  const [ax, ay] = paths.get(alto.c).centro;
  llamada("llamada-bajo", bajo, 20, 80 + MAPA_ALTO * 0.72, "start");
  llamada("llamada-alto", alto, ax - 40, ay + 150, "end");

  const leyenda = svg.append("g").attr("id", "leyenda").attr("opacity", 0);
  const colores = escala.range();
  const ancho = 520 / colores.length;
  colores.forEach((col, i) => leyenda.append("rect").attr("x", ANCHO - 520 + i * ancho).attr("y", 860).attr("width", ancho - 4).attr("height", 18).attr("rx", 3).attr("fill", col));
  leyenda.append("text").attr("x", ANCHO - 530).attr("y", 878).attr("text-anchor", "end").attr("fill", C.texto3).attr("font-size", 26).text(`${decimal(extremos[0])}%`);
  leyenda.append("text").attr("x", ANCHO - 520).attr("y", 840).attr("fill", C.texto3).attr("font-size", 24).text("MENOS");
  leyenda.append("text").attr("x", ANCHO).attr("y", 840).attr("text-anchor", "end").attr("fill", C.texto3).attr("font-size", 24).text(`MÁS · ${decimal(extremos[1])}%`);

  const apagado = d3.color(C.superficieAlta);
  const curva = gsap.parseEase("entrada");
  const SUBIDA = 1.6;
  const estado = { p: 0 };
  function pintar() {
    orden.forEach((e, i) => {
      const k = curva(Math.min(1, Math.max(0, (estado.p - i) / SUBIDA)));
      paths.get(e.c).nodo.setAttribute("fill", d3.interpolateRgb(apagado, escala(e[CAMPO][ANIO]))(k));
    });
  }
  pintar();

  const INICIO = 2.9;
  const TRAMO = 1.5;
  const TOTAL = orden.length - 1 + SUBIDA;
  const PASOS = 4;

  const tl = gsap.timeline({ paused: true });
  Reel.cabecera(tl);
  Reel.subtitulos(tl, [
    { texto: `¿Cuántos jóvenes de ${edadMin} a ${edadMax} votaron en ${ANIO}?`, desde: 0.4, hasta: 2.9 },
    { texto: `De *${bajo.n}*, con *${decimal(bajo[CAMPO][ANIO])}%*...`, desde: 3.1, hasta: 8.4 },
    { texto: `...a *${alto.n}*, con *${decimal(alto[CAMPO][ANIO])}%*.`, desde: 8.6, hasta: 12.3 },
  ]);
  tl.fromTo("#titulo-grafica", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 0.5);
  tl.fromTo("#mapa", { opacity: 0, scale: 0.97, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: D.escena, ease: "entrada" }, 0.8);
  for (let i = 0; i < PASOS; i++) {
    tl.to(estado, { p: (TOTAL * (i + 1)) / PASOS, duration: TRAMO, ease: "none", onUpdate: pintar }, INICIO + i * TRAMO);
  }
  tl.fromTo("#llamada-bajo", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, INICIO + 0.3);
  tl.fromTo("#llamada-alto", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, INICIO + PASOS * TRAMO - 0.4);
  tl.fromTo("#leyenda", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: D.escena, ease: "entrada" }, INICIO + PASOS * TRAMO + 0.4);
  tl.to(".foco-llamada", { scale: 1.6, transformOrigin: "50% 50%", duration: D.escena, ease: "escena" }, 10.4);
  tl.to(".foco-llamada", { scale: 1, transformOrigin: "50% 50%", duration: D.escena, ease: "escena" }, 11.3);
  tl.to("#visual", { opacity: 0, y: -24, duration: D.larga, ease: "salida" }, 12.3);
  Reel.cierre(tl, 12.7);
  window.__timelines["reel_estados"] = tl;
})();
</script>
