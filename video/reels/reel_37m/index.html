<script>
(() => {
  const { leer, decimal, D } = Reel;
  const C = BRAND.color;
  const n = leer("d-nacional");
  const ANIO = Object.keys(n).filter((k) => /^\d{4}$/.test(k)).sort().at(-1);

  const millonesJovenes = n[`abstencion_jovenes_${ANIO}`] / 1e6;

  const COLUMNAS = 11;
  const FILAS = 9;
  const total = COLUMNAS * FILAS;
  const campo = document.getElementById("campo");
  const pasoX = 900 / COLUMNAS;
  const pasoY = 520 / FILAS;
  for (let i = 0; i < total; i++) {
    const d = document.createElement("span");
    const joven = Math.floor((i + 1) * proporcion) > Math.floor(i * proporcion);
    d.className = joven ? "persona joven" : "persona";
    d.style.left = `${(i % COLUMNAS) * pasoX + pasoX / 2}px`;
    d.style.top = `${Math.floor(i / COLUMNAS) * pasoY + pasoY / 2}px`;
    campo.append(d);
  }
  document.getElementById("etiqueta-jovenes").textContent = `${decimal(millonesJovenes)} millones de 18 a 29 años`;

  const cifra = document.getElementById("cifra");
  const contador = { v: 0 };
  const escribir = () => { cifra.textContent = decimal(contador.v); };
  escribir();

  const tl = gsap.timeline({ paused: true });
  Reel.cabecera(tl);
  Reel.subtitulos(tl, [
    { texto: `*${decimal(millones)} millones* no votaron en ${ANIO}.`, desde: 0.5, hasta: 5.6 },
    { texto: `Uno de cada *${palabras[cadaCuantos] ?? cadaCuantos}* tiene entre 18 y 29.`, desde: 6.2, hasta: 12.3 },
  ]);
  tl.fromTo("#bloque-cifra", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: D.escena, ease: "entrada" }, 0.4);
  tl.to(contador, { v: millones, duration: 1.8, ease: "entrada", onUpdate: escribir }, 0.5);
  tl.fromTo("#millones", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 1.9);
  tl.to("#bloque-cifra", { scale: 0.5, duration: D.escena * 1.4, ease: "escena" }, 3.0);
  tl.fromTo(".persona", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: D.larga, ease: "entrada", stagger: { each: 0.012, grid: [FILAS, COLUMNAS], from: "start" } }, 4.4);
  tl.to(".persona.joven", { backgroundColor: C.luz, boxShadow: `0 0 18px ${C.luzHalo}`, duration: D.escena, ease: "entrada", stagger: 0.03 }, 6.4);
  tl.fromTo("#etiqueta-jovenes", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: D.larga, ease: "entrada" }, 8.3);
  tl.to(".persona:not(.joven)", { opacity: 0.45, duration: D.escena, ease: "escena" }, 8.9);
  tl.to(".persona.joven", { scale: 1.15, duration: D.escena, ease: "escena" }, 10.0);
  tl.to(".persona.joven", { scale: 1, duration: D.escena, ease: "escena" }, 11.0);
  tl.to("#visual", { opacity: 0, y: -24, duration: D.larga, ease: "salida" }, 12.3);
  Reel.cierre(tl, 12.7);
  window.__timelines["reel_37m"] = tl;
})();
</script>
