<script>
(() => {
  const { leer, decimal, config, meta } = Reel;
  const C = BRAND.color;
  const F = BRAND.fuente;
  const nac = leer("d-nacional");
  const edad = leer("d-edad");
  const coh = leer("d-cohortes").larga;
  const est = leer("d-estados");
  const geo = leer("d-geo");
  const anios = Object.keys(nac).filter((k) => /^\d{4}$/.test(k)).sort();
  const ANIO = anios.at(-1);
  const pon = (id, html) => { document.getElementById(id).innerHTML = html; };
  const fuente = `Fuente: ${meta.fuente}.`;

  const laminas = [...document.querySelectorAll(".lamina")];
  laminas.forEach((l, i) => {
    l.querySelector(".nombre-marca").textContent = BRAND.nombre;
    l.querySelector(".folio").textContent = `${i + 1}/${laminas.length}`;
  });

  function semilla(a) {
    return () => {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const azar = semilla(Number(ANIO));
  const lienzo = document.getElementById("portada-campo");
  const ctx = lienzo.getContext("2d");
  const COL = 22;
  const FIL = 16;
  for (let f = 0; f < FIL; f++) {
    for (let c = 0; c < COL; c++) {
      const px = (c + 0.5) * (1080 / COL) + (azar() - 0.5) * 30;
      const py = 150 + (f + 0.5) * (620 / FIL) + (azar() - 0.5) * 24;
      const encendida = c / COL < 0.45 + (azar() - 0.5) * 0.25;
      const r = 2 + azar() * 2.4;
      if (encendida) {
        const g = ctx.createRadialGradient(px, py, 0, px, py, 18);
        g.addColorStop(0, C.luzHalo);
        g.addColorStop(1, "transparent");
        ctx.fillStyle = g;
        ctx.fillRect(px - 18, py - 18, 36, 36);
      }
      ctx.fillStyle = encendida ? C.luz : C.apagada;
      ctx.globalAlpha = encendida ? 0.6 + azar() * 0.4 : 0.55;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  pon("portada-titulo", BRAND.nombre);
  pon("portada-texto", `Qué pasó con el voto joven en México entre ${anios[0]} y ${ANIO}, con datos del INE.`);

  const millones = nac[`abstencion_${ANIO}`] / 1e6;
  const jov = nac[`abstencion_jovenes_${ANIO}`] / 1e6;
  const prop = nac[`abstencion_jovenes_${ANIO}`] / nac[`abstencion_${ANIO}`];
  const palabras = { 2: "dos", 3: "tres", 4: "cuatro", 5: "cinco" };
  pon("m-cifra", decimal(millones));
  pon("m-titular", `millones de personas no votaron en ${ANIO}.`);
  pon("m-texto", `Uno de cada <em>${palabras[Math.round(1 / prop)]}</em> tenía entre 18 y 29 años: <em>${decimal(jov)} millones</em> de jóvenes.`);
  {
    const total = 33;
    const ancho = 900;
    const paso = ancho / total;
    const svg = d3.select("#m-puntos").append("svg").attr("width", ancho).attr("height", 40);
    for (let i = 0; i < total; i++) {
      const joven = Math.floor((i + 1) * prop) > Math.floor(i * prop);
      svg.append("circle").attr("cx", i * paso + paso / 2).attr("cy", 20).attr("r", 10).attr("fill", joven ? C.luz : C.apagada);
    }
  }

  {
    const tope = parseInt(est.grupos.at(-1), 10);
    const pts = edad.edades.map((e, i) => ({ e, v: edad[ANIO][i] })).filter((p) => p.e < tope && p.v !== null);
    const min = pts.reduce((a, b) => (b.v < a.v ? b : a));
    pon("c-titular", `A los <em>${min.e}</em> años, solo <em>${Math.round(min.v)}%</em> votó.`);
    pon("c-pie", `Participación por edad en ${ANIO}, de ${pts[0].e} a ${pts.at(-1).e} años. ${fuente}`);
    const W = 900;
    const H = 560;
    const M = { a: 20, d: 20, b: 60, i: 80 };
    const x = d3.scaleLinear().domain(d3.extent(pts, (p) => p.e)).range([M.i, W - M.d]);
    const y = d3.scaleLinear().domain(d3.extent(pts, (p) => p.v)).nice().range([H - M.b, M.a]);
    const svg = d3.select("#c-grafica").append("svg").attr("width", W).attr("height", H);
    y.ticks(4).forEach((t) => {
      svg.append("rect").attr("x", M.i).attr("y", y(t) - 1).attr("width", W - M.i - M.d).attr("height", 2).attr("fill", C.linea);
      svg.append("text").attr("x", M.i - 16).attr("y", y(t) + 9).attr("text-anchor", "end").attr("fill", C.texto3).attr("font-size", 26).text(`${t}%`);
    });
    [x.domain()[0], ...x.ticks(6).filter((t) => t > x.domain()[0] + 4 && t < x.domain()[1] - 4 && Math.abs(t - min.e) > 6), x.domain()[1]].forEach((t) => svg.append("text").attr("x", x(t)).attr("y", H - M.b + 44).attr("text-anchor", "middle").attr("fill", C.texto3).attr("font-size", 26).text(t));
    svg.append("path").attr("d", d3.area().x((p) => x(p.e)).y0(y.range()[0]).y1((p) => y(p.v)).curve(d3.curveMonotoneX)(pts)).attr("fill", C.luzHalo).attr("opacity", 0.45);
    svg.append("path").attr("d", d3.line().x((p) => x(p.e)).y((p) => y(p.v)).curve(d3.curveMonotoneX)(pts)).attr("fill", "none").attr("stroke", C.luz).attr("stroke-width", 7).attr("stroke-linecap", "round");
    svg.append("circle").attr("cx", x(min.e)).attr("cy", y(min.v)).attr("r", 34).attr("fill", C.luzHalo);
    svg.append("circle").attr("cx", x(min.e)).attr("cy", y(min.v)).attr("r", 15).attr("fill", C.luz).attr("stroke", C.fondo).attr("stroke-width", 5);
    svg.append("text").attr("x", x(min.e)).attr("y", H - M.b + 44).attr("text-anchor", "middle").attr("fill", C.luz).attr("font-size", 28).attr("font-weight", 600).text(`${min.e} AÑOS`);
  }

  {
    const fila = coh.filas.reduce((a, b) => (b[0] < a[0] ? b : a));
    const yrs = coh.campos.slice(1).map((c) => Number(c.replace(/\D/g, "")));
    const cols = yrs.map((a, i) => ({ a, edad: fila[0] + (a - yrs[0]), v: fila[i + 1] }));
    pon("k-titular", `Tenían <em>${fila[0]}</em> en ${yrs[0]}. ${yrs.at(-1) - yrs[0]} años después, votó <em>${decimal(cols.at(-1).v)}%</em>.`);
    pon("k-pie", `${meta.cohorte} ${fuente}`);
    const W = 900;
    const H = 560;
    const BASE = 440;
    const y = d3.scaleLinear().domain([0, 100]).range([0, 400]);
    const x = d3.scalePoint().domain(yrs).range([150, W - 150]);
    const esc = d3.scaleQuantize().domain([0, 100]).range(d3.range(9).map((i) => C[`seq${i}`]));
    const svg = d3.select("#k-grafica").append("svg").attr("width", W).attr("height", H);
    svg.append("rect").attr("x", 0).attr("y", BASE).attr("width", W).attr("height", 2).attr("fill", C.linea);
    cols.forEach((c, i) => {
      const h = y(c.v);
      svg.append("rect").attr("x", x(c.a) - 90).attr("y", BASE - h).attr("width", 180).attr("height", h).attr("rx", 6).attr("fill", i === 0 ? C.luz : esc(c.v));
      svg.append("text").attr("x", x(c.a)).attr("y", BASE - h - 24).attr("text-anchor", "middle").attr("fill", i === 0 ? C.luz : C.texto).style("font-family", F.titulo).style("font-stretch", F.estiramientoTitulo).attr("font-weight", F.peso.extra).attr("font-size", 80).text(`${decimal(c.v)}%`);
      svg.append("text").attr("x", x(c.a)).attr("y", BASE + 52).attr("text-anchor", "middle").attr("fill", C.texto2).attr("font-size", 32).attr("font-weight", 600).text(c.a);
      svg.append("text").attr("x", x(c.a)).attr("y", BASE + 94).attr("text-anchor", "middle").attr("fill", C.texto3).attr("font-size", 26).text(`${c.edad} años`);
    });
  }

  {
    const tope = parseInt(est.grupos.at(-1), 10);
    const pts = edad.edades.map((e, i) => ({ e, h: edad[`${ANIO}_h`][i], m: edad[`${ANIO}_m`][i] })).filter((p) => p.e < tope && p.h !== null && p.m !== null);
    const tot = edad.edades.map((e, i) => ({ e, v: edad[ANIO][i] })).filter((p) => p.e < tope);
    const ref = pts.find((p) => p.e === tot.reduce((a, b) => (b.v < a.v ? b : a)).e);
    pon("g-titular", `A los ${ref.e}, votaron <em style="color:${C.mujer}">${decimal(ref.m)}%</em> de las mujeres y <em style="color:${C.hombre}">${decimal(ref.h)}%</em> de los hombres.`);
    pon("g-pie", `Participación por edad y sexo en ${ANIO}. ${fuente}`);
    const W = 900;
    const H = 520;
    const M = { a: 20, d: 20, b: 60, i: 80 };
    const x = d3.scaleLinear().domain(d3.extent(pts, (p) => p.e)).range([M.i, W - M.d]);
    const y = d3.scaleLinear().domain([d3.min(pts, (p) => Math.min(p.h, p.m)), d3.max(pts, (p) => Math.max(p.h, p.m))]).nice().range([H - M.b, M.a]);
    const svg = d3.select("#g-grafica").append("svg").attr("width", W).attr("height", H).style("margin-top", "50px");
    y.ticks(4).forEach((t) => {
      svg.append("rect").attr("x", M.i).attr("y", y(t) - 1).attr("width", W - M.i - M.d).attr("height", 2).attr("fill", C.linea);
      svg.append("text").attr("x", M.i - 16).attr("y", y(t) + 9).attr("text-anchor", "end").attr("fill", C.texto3).attr("font-size", 26).text(`${t}%`);
    });
    [x.domain()[0], ...x.ticks(6).filter((t) => t > x.domain()[0] + 4 && t < x.domain()[1] - 4), x.domain()[1]].forEach((t) => svg.append("text").attr("x", x(t)).attr("y", H - M.b + 44).attr("text-anchor", "middle").attr("fill", C.texto3).attr("font-size", 26).text(t));
    svg.append("rect").attr("x", x(ref.e) - 1).attr("y", y(ref.m)).attr("width", 3).attr("height", y(ref.h) - y(ref.m)).attr("fill", C.texto);
    [["m", C.mujer, "MUJERES"], ["h", C.hombre, "HOMBRES"]].forEach(([k, col, nombre], j) => {
      svg.append("path").attr("d", d3.line().x((p) => x(p.e)).y((p) => y(p[k])).curve(d3.curveMonotoneX)(pts)).attr("fill", "none").attr("stroke", col).attr("stroke-width", 6).attr("stroke-linecap", "round");
      svg.append("circle").attr("cx", x(ref.e)).attr("cy", y(ref[k])).attr("r", 11).attr("fill", col).attr("stroke", C.fondo).attr("stroke-width", 4);
      svg.append("circle").attr("cx", M.i + 10 + j * 230).attr("cy", -26).attr("r", 10).attr("fill", col);
      svg.append("text").attr("x", M.i + 30 + j * 230).attr("y", -17).attr("fill", col).attr("font-size", 26).attr("font-weight", 600).text(nombre);
    });
  }

  {
    const CAMPO = "jovenes_18_24";
    const [eMin, eMax] = CAMPO.split("_").slice(1).map(Number);
    const ests = est.estados.filter((e) => e[CAMPO][ANIO] !== null).sort((a, b) => a[CAMPO][ANIO] - b[CAMPO][ANIO]);
    const bajo = ests[0];
    const alto = ests.at(-1);
    pon("e-titular", `${bajo.n} contra ${alto.n}.`);
    pon("e-pie", `Participación de jóvenes de ${eMin} a ${eMax} años por estado, ${ANIO}. ${fuente}`);
    const capa = topojson.feature(geo, geo.objects[Object.keys(geo.objects)[0]]);
    const W = 900;
    const H = 460;
    const ruta = d3.geoPath(d3.geoMercator().fitSize([W, H], capa));
    const svg = d3.select("#e-mapa").append("svg").attr("width", W).attr("height", H);
    for (const f of capa.features) {
      const c = f.properties.c;
      const fill = c === alto.c ? C.luz : c === bajo.c ? C.apagada : C.superficieAlta;
      svg.append("path").attr("d", ruta(f)).attr("fill", fill).attr("stroke", C.fondo).attr("stroke-width", 1.5);
    }
    document.getElementById("e-duo").innerHTML = [bajo, alto].map((e, i) => `<div><span class="nombre">${e.n}</span><span class="valor" style="color:${i ? C.luz : C.texto2}">${decimal(e[CAMPO][ANIO])}%</span></div>`).join("");
  }

  pon("f-titular", "Que tu luz no se apague.");
  pon("f-texto", "Busca tu estado y tu municipio, compara y comparte.");
  pon("f-url", config.url);
  pon("f-pie", fuente);

  const tl = gsap.timeline({ paused: true });
  laminas.forEach((l, i) => {
    tl.set(l, { autoAlpha: i === 0 ? 1 : 0 }, 0);
    if (i > 0) tl.set(laminas[i - 1], { autoAlpha: 0 }, i).set(l, { autoAlpha: 1 }, i);
  });
  window.__timelines["carrusel"] = tl;
})();
</script>
</body>
</html>
